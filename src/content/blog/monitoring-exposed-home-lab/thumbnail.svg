<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b794f4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#b794f4;stop-opacity:0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Dashboard illustration -->
  <g transform="translate(760, 150)">
    <rect x="-15" y="-15" width="380" height="330" fill="url(#glow)" rx="20"/>

    <rect x="0" y="0" width="350" height="300" fill="#2d3748" stroke="#b794f4" stroke-width="4" rx="12"/>
    <circle cx="28" cy="30" r="7" fill="#fc8181"/>
    <circle cx="52" cy="30" r="7" fill="#f6ad55"/>
    <circle cx="76" cy="30" r="7" fill="#68d391"/>

    <!-- line chart -->
    <polyline points="20,150 70,120 110,160 150,90 190,130 230,70 270,100 310,60"
      fill="none" stroke="#68d391" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- bars -->
    <rect x="20" y="200" width="24" height="70" fill="#63b3ed"/>
    <rect x="56" y="220" width="24" height="50" fill="#63b3ed"/>
    <rect x="92" y="180" width="24" height="90" fill="#63b3ed"/>
    <rect x="128" y="235" width="24" height="35" fill="#f6ad55"/>
    <rect x="164" y="210" width="24" height="60" fill="#63b3ed"/>
    <rect x="200" y="245" width="24" height="25" fill="#fc8181"/>
    <rect x="236" y="195" width="24" height="75" fill="#63b3ed"/>
    <rect x="272" y="225" width="24" height="45" fill="#63b3ed"/>
    <rect x="308" y="240" width="16" height="30" fill="#63b3ed"/>
  </g>

  <!-- Title -->
  <text x="80" y="192" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff">
    Monitoring a Home Lab
  </text>
  <text x="80" y="258" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#b794f4">
    Exposed to the Internet
  </text>

  <!-- Subtitle -->
  <text x="80" y="340" font-family="Arial, sans-serif" font-size="28" fill="#a0aec0">
    Grafana, Loki, Prometheus and CrowdSec
  </text>

  <!-- Decorative elements -->
  <circle cx="1100" cy="550" r="40" fill="#68d391" opacity="0.1"/>
  <circle cx="150" cy="80" r="30" fill="#63b3ed" opacity="0.1"/>
  <circle cx="1050" cy="450" r="25" fill="#f6ad55" opacity="0.1"/>
</svg>
