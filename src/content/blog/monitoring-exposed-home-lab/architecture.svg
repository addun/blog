<svg width="960" height="330" viewBox="0 0 960 330" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#68d391" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#63b3ed" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f6ad55" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b794f4" />
    </marker>
  </defs>

  <rect width="960" height="330" fill="url(#bg)"/>

  <!-- Caddy -->
  <rect x="40" y="40" width="220" height="100" rx="10" fill="#22543d" stroke="#68d391" stroke-width="2"/>
  <text x="150" y="78" fill="#f7fafc" font-size="19" text-anchor="middle" font-weight="bold">Caddy</text>
  <text x="150" y="100" fill="#a0aec0" font-size="12" text-anchor="middle">access.log (json)</text>
  <text x="150" y="118" fill="#a0aec0" font-size="12" text-anchor="middle">:2019 admin / metrics</text>

  <!-- Alloy -->
  <rect x="360" y="40" width="220" height="100" rx="10" fill="#1a365d" stroke="#63b3ed" stroke-width="2"/>
  <text x="470" y="78" fill="#f7fafc" font-size="19" text-anchor="middle" font-weight="bold">Grafana Alloy</text>
  <text x="470" y="100" fill="#a0aec0" font-size="12" text-anchor="middle">docker log discovery</text>
  <text x="470" y="118" fill="#a0aec0" font-size="12" text-anchor="middle">JSON parse + GeoIP enrich</text>

  <!-- Prometheus -->
  <rect x="360" y="200" width="220" height="100" rx="10" fill="#553c1f" stroke="#ecc94b" stroke-width="2"/>
  <text x="470" y="238" fill="#f7fafc" font-size="19" text-anchor="middle" font-weight="bold">Prometheus</text>
  <text x="470" y="260" fill="#faf089" font-size="12" text-anchor="middle">scrapes Caddy metrics</text>
  <text x="470" y="278" fill="#faf089" font-size="12" text-anchor="middle">15s interval</text>

  <!-- Loki -->
  <rect x="680" y="40" width="220" height="100" rx="10" fill="#1a365d" stroke="#63b3ed" stroke-width="2"/>
  <text x="790" y="78" fill="#f7fafc" font-size="19" text-anchor="middle" font-weight="bold">Loki</text>
  <text x="790" y="100" fill="#a0aec0" font-size="12" text-anchor="middle">log storage</text>
  <text x="790" y="118" fill="#a0aec0" font-size="12" text-anchor="middle">30 day retention</text>

  <!-- Grafana -->
  <rect x="680" y="200" width="220" height="100" rx="10" fill="#44337a" stroke="#b794f4" stroke-width="2"/>
  <text x="790" y="238" fill="#f7fafc" font-size="19" text-anchor="middle" font-weight="bold">Grafana</text>
  <text x="790" y="260" fill="#e9d8fd" font-size="12" text-anchor="middle">dashboards</text>
  <text x="790" y="278" fill="#e9d8fd" font-size="12" text-anchor="middle">logs + metrics, one pane</text>

  <!-- arrows -->
  <line x1="260" y1="90" x2="355" y2="90" stroke="#68d391" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="307" y="75" fill="#c6f6d5" font-size="12" text-anchor="middle">logs</text>

  <line x1="200" y1="140" x2="420" y2="195" stroke="#ecc94b" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="280" y="185" fill="#faf089" font-size="12" text-anchor="middle">:2019/metrics</text>

  <line x1="580" y1="90" x2="675" y2="90" stroke="#68d391" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <line x1="580" y1="250" x2="675" y2="250" stroke="#ecc94b" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <line x1="790" y1="140" x2="790" y2="195" stroke="#b794f4" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
</svg>
