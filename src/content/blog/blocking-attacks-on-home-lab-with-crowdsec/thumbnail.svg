<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fc8181;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#fc8181;stop-opacity:0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Shield illustration -->
  <g transform="translate(790, 130)">
    <rect x="-45" y="-70" width="330" height="500" fill="url(#glow)" rx="20"/>

    <!-- shield -->
    <path d="M150,0 L280,45 L280,190 C280,290 220,340 150,370 C80,340 20,290 20,190 L20,45 Z"
      fill="#2d3748" stroke="#68d391" stroke-width="4"/>

    <!-- checkmark -->
    <polyline points="80,180 130,235 225,120" fill="none" stroke="#68d391" stroke-width="14"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- blocked IP chips: one above the shield, one below -->
    <g font-family="Consolas, monospace" font-size="15" fill="#fc8181">
      <rect x="75" y="-58" width="150" height="34" rx="6" fill="#742a2a" opacity="0.9"/>
      <text x="150" y="-35" text-anchor="middle">45.33.x.x  ✕</text>

      <rect x="75" y="392" width="150" height="34" rx="6" fill="#742a2a" opacity="0.9"/>
      <text x="150" y="415" text-anchor="middle">193.19.x.x ✕</text>
    </g>
  </g>

  <!-- Title -->
  <text x="80" y="192" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff">
    Blocking Attacks on a
  </text>
  <text x="80" y="258" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#68d391">
    Home Lab with CrowdSec
  </text>

  <!-- Subtitle -->
  <text x="80" y="340" font-family="Arial, sans-serif" font-size="28" fill="#a0aec0">
    Caddy + CrowdSec
  </text>

  <!-- Decorative elements -->
  <circle cx="1130" cy="580" r="40" fill="#fc8181" opacity="0.1"/>
  <circle cx="150" cy="80" r="30" fill="#68d391" opacity="0.1"/>
  <circle cx="1050" cy="480" r="25" fill="#63b3ed" opacity="0.1"/>
</svg>
