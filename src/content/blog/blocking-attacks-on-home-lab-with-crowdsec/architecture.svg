<svg width="960" height="460" viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#68d391" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fc8181" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#63b3ed" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b794f4" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ecc94b" />
    </marker>
  </defs>

  <rect width="960" height="460" fill="url(#bg)"/>

  <!-- ================= main request flow (top band) ================= -->

  <!-- Visitor: plain browser window, top lane -->
  <g transform="translate(90,110)">
    <rect x="-32" y="-24" width="64" height="48" rx="6" fill="#2d3748" stroke="#68d391" stroke-width="2.5"/>
    <path d="M -32,-18 a6,6 0 0 1 6,-6 h52 a6,6 0 0 1 6,6 v6 h-64 Z" fill="#22543d"/>
    <circle cx="-24" cy="-18" r="2.5" fill="#fc8181"/>
    <circle cx="-16" cy="-18" r="2.5" fill="#f6ad55"/>
    <circle cx="-8" cy="-18" r="2.5" fill="#68d391"/>
    <line x1="-22" y1="-2" x2="16" y2="-2" stroke="#68d391" stroke-width="2" opacity="0.6"/>
    <line x1="-22" y1="8" x2="4" y2="8" stroke="#68d391" stroke-width="2" opacity="0.6"/>
    <line x1="-22" y1="18" x2="12" y2="18" stroke="#68d391" stroke-width="2" opacity="0.6"/>
  </g>
  <text x="90" y="180" fill="#c6f6d5" font-size="13" text-anchor="middle" font-weight="bold">visitor</text>

  <!-- Scanner: same browser window, red, bottom lane -->
  <g transform="translate(90,290)">
    <rect x="-32" y="-24" width="64" height="48" rx="6" fill="#2d3748" stroke="#fc8181" stroke-width="2.5"/>
    <path d="M -32,-18 a6,6 0 0 1 6,-6 h52 a6,6 0 0 1 6,6 v6 h-64 Z" fill="#742a2a"/>
    <circle cx="-24" cy="-18" r="2.5" fill="#fc8181"/>
    <circle cx="-16" cy="-18" r="2.5" fill="#f6ad55"/>
    <circle cx="-8" cy="-18" r="2.5" fill="#fc8181"/>
    <line x1="-22" y1="-2" x2="16" y2="-2" stroke="#fc8181" stroke-width="2" opacity="0.6"/>
    <line x1="-22" y1="8" x2="4" y2="8" stroke="#fc8181" stroke-width="2" opacity="0.6"/>
    <line x1="-22" y1="18" x2="12" y2="18" stroke="#fc8181" stroke-width="2" opacity="0.6"/>
  </g>
  <text x="90" y="335" fill="#fed7d7" font-size="13" text-anchor="middle" font-weight="bold">scanner</text>

  <!-- Caddy -->
  <rect x="245" y="130" width="220" height="120" rx="10" fill="#1a365d" stroke="#63b3ed" stroke-width="2"/>
  <text x="355" y="197" fill="#f7fafc" font-size="19" text-anchor="middle" font-weight="bold">Caddy</text>

  <!-- Upstream -->
  <rect x="740" y="130" width="170" height="100" rx="10" fill="#22543d" stroke="#68d391" stroke-width="2"/>
  <text x="825" y="162" fill="#f7fafc" font-size="16" text-anchor="middle" font-weight="bold">upstream</text>
  <text x="825" y="196" fill="#c6f6d5" font-size="12" text-anchor="middle">Immich, Jellyfin,</text>
  <text x="825" y="216" fill="#c6f6d5" font-size="12" text-anchor="middle">Home Assistant...</text>

  <!-- visitor -> caddy, top lane -->
  <line x1="128" y1="128" x2="225" y2="150" stroke="#68d391" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- caddy -> upstream, straight through, the only path that continues -->
  <line x1="470" y1="150" x2="735" y2="150" stroke="#68d391" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="587" y="138" fill="#c6f6d5" font-size="12" text-anchor="middle">reverse_proxy</text>

  <!-- scanner -> caddy, bottom lane, blocked before it gets there -->
  <line x1="128" y1="272" x2="225" y2="230" stroke="#fc8181" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <line x1="475" y1="230" x2="545" y2="230" stroke="#fc8181" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <g transform="translate(568,225)">
    <path d="M0,-13 L11,-7.5 L11,3 C11,11 5.5,16.5 0,19 C-5.5,16.5 -11,11 -11,3 L-11,-7.5 Z"
      fill="#742a2a" stroke="#fc8181" stroke-width="2"/>
    <line x1="-4.5" y1="-1" x2="4.5" y2="8" stroke="#fed7d7" stroke-width="2" stroke-linecap="round"/>
    <line x1="4.5" y1="-1" x2="-4.5" y2="8" stroke="#fed7d7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ================= support flow (below the main flow) ================= -->

  <!-- CrowdSec -->
  <rect x="245" y="340" width="220" height="70" rx="10" fill="#44337a" stroke="#b794f4" stroke-width="2"/>
  <text x="355" y="382" fill="#f7fafc" font-size="18" text-anchor="middle" font-weight="bold">CrowdSec</text>

  <!-- CAPI -->
  <rect x="555" y="340" width="200" height="100" rx="10" fill="#553c1f" stroke="#ecc94b" stroke-width="2"/>
  <text x="655" y="368" fill="#f7fafc" font-size="18" text-anchor="middle" font-weight="bold">Central API</text>
  <text x="655" y="390" fill="#faf089" font-size="12" text-anchor="middle">community blocklist</text>
  <text x="655" y="407" fill="#faf089" font-size="12" text-anchor="middle">shared across the network</text>

  <!-- caddy -> crowdsec (logs) -->
  <line x1="320" y1="250" x2="320" y2="335" stroke="#b794f4" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- crowdsec -> caddy (decisions poll) -->
  <line x1="390" y1="335" x2="390" y2="250" stroke="#63b3ed" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- crowdsec <-> capi -->
  <line x1="465" y1="378" x2="550" y2="378" stroke="#ecc94b" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <line x1="550" y1="392" x2="465" y2="392" stroke="#ecc94b" stroke-width="2" marker-end="url(#arrowOrange)"/>
</svg>
