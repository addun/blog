<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a0aec0" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#63b3ed" />
    </marker>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- Device -->
  <rect x="20" y="155" width="190" height="110" rx="10" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
  <text x="115" y="200" fill="#f7fafc" font-size="18" text-anchor="middle" font-weight="bold">Device</text>
  <text x="115" y="222" fill="#a0aec0" font-size="12" text-anchor="middle">phone / laptop / TV</text>
  <text x="115" y="242" fill="#a0aec0" font-size="12" text-anchor="middle">DNS: 192.168.x.x</text>

  <!-- Router -->
  <rect x="300" y="155" width="190" height="110" rx="10" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
  <text x="395" y="200" fill="#f7fafc" font-size="18" text-anchor="middle" font-weight="bold">Router</text>
  <text x="395" y="222" fill="#a0aec0" font-size="12" text-anchor="middle">hands out DNS</text>
  <text x="395" y="242" fill="#a0aec0" font-size="12" text-anchor="middle">server via DHCP</text>

  <!-- Local DNS / AdGuard -->
  <rect x="580" y="130" width="230" height="160" rx="10" fill="#22543d" stroke="#68d391" stroke-width="2"/>
  <text x="695" y="168" fill="#f7fafc" font-size="18" text-anchor="middle" font-weight="bold">Local DNS</text>
  <text x="695" y="190" fill="#c6f6d5" font-size="12" text-anchor="middle">AdGuard Home</text>
  <rect x="605" y="205" width="180" height="60" rx="6" fill="#1a365d"/>
  <text x="695" y="228" fill="#e2e8f0" font-size="13" text-anchor="middle">filters ads /</text>
  <text x="695" y="246" fill="#e2e8f0" font-size="13" text-anchor="middle">trackers</text>

  <!-- Upstream -->
  <rect x="920" y="145" width="260" height="130" rx="10" fill="#2c3e50" stroke="#4299e1" stroke-width="2"/>
  <text x="1050" y="185" fill="#f7fafc" font-size="18" text-anchor="middle" font-weight="bold">Upstream resolver</text>
  <text x="1050" y="207" fill="#a0aec0" font-size="12" text-anchor="middle">Cloudflare / Google /</text>
  <text x="1050" y="225" fill="#a0aec0" font-size="12" text-anchor="middle">Quad9</text>
  <text x="1050" y="252" fill="#63b3ed" font-size="12" text-anchor="middle">public internet</text>

  <!-- Arrow: Device -> Router -->
  <line x1="210" y1="210" x2="295" y2="210" stroke="#a0aec0" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <text x="252" y="180" fill="#e2e8f0" font-size="13" text-anchor="middle">"what's the IP for</text>
  <text x="252" y="196" fill="#e2e8f0" font-size="13" text-anchor="middle">google.com?"</text>

  <!-- Arrow: Router -> Local DNS -->
  <line x1="490" y1="210" x2="575" y2="210" stroke="#a0aec0" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <text x="532" y="180" fill="#e2e8f0" font-size="13" text-anchor="middle">DNS config points</text>
  <text x="532" y="196" fill="#e2e8f0" font-size="13" text-anchor="middle">to local DNS</text>

  <!-- Arrow: Local DNS -> Upstream -->
  <line x1="810" y1="210" x2="915" y2="210" stroke="#63b3ed" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="862" y="180" fill="#bee3f8" font-size="13" text-anchor="middle" font-weight="bold">DoH / DoT</text>
  <text x="862" y="196" fill="#bee3f8" font-size="12" text-anchor="middle">(encrypted, :443/:853)</text>

  <!-- Leg labels -->
  <line x1="20" y1="330" x2="810" y2="330" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="415" y="352" fill="#a0aec0" font-size="13" text-anchor="middle">plain UDP :53 - unencrypted, but it's your own trusted LAN</text>

  <line x1="810" y1="370" x2="1180" y2="370" stroke="#4299e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="995" y="392" fill="#63b3ed" font-size="13" text-anchor="middle">encrypted - the only leg on the public internet</text>
</svg>
