<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#63b3ed;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#63b3ed;stop-opacity:0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Backup illustration: apps -> encrypted repo -> restore drill -->
  <g transform="translate(790, 130)">
    <rect x="-45" y="-70" width="330" height="500" fill="url(#glow)" rx="20"/>

    <g font-family="Consolas, monospace" font-size="17">
      <rect x="0" y="0" width="290" height="70" rx="10" fill="#2d3748" stroke="#63b3ed" stroke-width="3"/>
      <text x="20" y="30" fill="#ffffff">/apps</text>
      <text x="20" y="54" fill="#a0aec0">compose + configs + photos</text>

      <rect x="0" y="100" width="290" height="70" rx="10" fill="#2d3748" stroke="#63b3ed" stroke-width="3"/>
      <text x="20" y="130" fill="#ffffff">restic repo</text>
      <text x="20" y="154" fill="#a0aec0">encrypted, deduplicated</text>

      <rect x="0" y="200" width="290" height="70" rx="10" fill="#2d3748" stroke="#63b3ed" stroke-width="3"/>
      <text x="20" y="230" fill="#ffffff">restore drill</text>
      <text x="20" y="254" fill="#68d391">[OK] every 1st of month</text>
    </g>

    <!-- arrows -->
    <g stroke="#63b3ed" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="145" y1="72" x2="145" y2="98"/>
      <line x1="145" y1="172" x2="145" y2="198"/>
    </g>

    <!-- checkmark badge -->
    <circle cx="145" cy="340" r="38" fill="#2d3748" stroke="#68d391" stroke-width="4"/>
    <polyline points="125,340 140,356 168,322" fill="none" stroke="#68d391" stroke-width="8"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="80" y="192" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff">
    Backing Up a Home Lab
  </text>
  <text x="80" y="258" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#63b3ed">
    with restic
  </text>

  <!-- Subtitle -->
  <text x="80" y="340" font-family="Arial, sans-serif" font-size="28" fill="#a0aec0">
    Daily snapshots, e-mail reports, monthly restore drill
  </text>
</svg>
